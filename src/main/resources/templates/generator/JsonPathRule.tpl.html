<html xmlns:th="http://www.thymeleaf.org">
  <th:block th:fragment="ruleRule(number, rule)">
    <th:block th:text="${number + '.'}"/>
    <code th:text="${rule.jsonPath}"></code>
  </th:block>

  <th:block th:fragment="ruleDescription(rule)">
    Takes the value under the given JSON Path.
  </th:block>
</html>
