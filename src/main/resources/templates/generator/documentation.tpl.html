<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <title>Rulez Documentation</title>
  </head>
  <body>
    <h1>Rulez Documentation</h1>
    <h2>generated by Rulez</h2>

    <table>
      <thead>
        <tr>
          <th>Attribute</th>
          <th>Description</th>
          <th>Rule</th>
          <th>Rule description</th>
        </tr>
      </thead>

      <tbody>
        <th:block th:each="ruleset : ${rulesets}">
          <tr th:replace="ruleset :: ruleset(${ruleset})"></tr>
        </th:block>
      </tbody>
    </table>
  </body>
</html>
